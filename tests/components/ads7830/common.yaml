ads7830:
  i2c_id: i2c_bus
  id: adc1
  reference_voltage: 3.3

sensor:
  - platform: ads7830
    id: test_sensor
    device: adc1
    channel: 1
    use_external_reference: true
    update_interval: 1s

binary_sensor:
  - platform: ads7830
    id: test_binary_sensor
    device: adc1
    channel: 2
    threshold: 127
    inverted: true
    update_interval: 1s
